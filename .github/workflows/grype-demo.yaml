# This workflow checks out code, builds an image, performs a container image
# scan, evaluates the image, and promotes it if it passes.

name: Grype Demo

on: 
  #push:
  #  branches:
  #    - main
  #schedule:
  #  - cron: '42 20 */14 * *'
  workflow_dispatch:

### Least-privilege by default
permissions:
  contents: read
env:
  REGISTRY: ghcr.io           ### if you change this you will probably need to update the build section to handle registry credentials  

jobs:

  Build:
    name: Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.set_image.outputs.image }}
    steps:
    - name: "Set IMAGE Environmental Variable"
      id: set_image
      run: |
        IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
        echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"                 
        ### ${IMAGE,,} makes sure it's all lowercase
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Log in to the Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push container
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.set_image.outputs.image }}
        push: true
        
  Grype-Check:
    name: Grype Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [Build]
    steps:
    - name: Install grype
      run: |
        sudo curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        export PATH="/usr/local/bin/:$PATH"
    - name: Generate Vulnerability Report 
      run: | 
        grype -o json ${{ needs.build.outputs.image }} > $(basename ${GITHUB_REPOSITORY,,}).vuln.json
        # if we want to break the pipeline if vulnerabilities of a certain
        # severity are found, we can use the -f option e.g.
        # grype -o json -f high image:tag
        # if we don't want to gate on that and instead just want
        # to generate reports, just remove the -f flag.
    - name: Archive Vulnerability Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: vuln-report
        path: ./*.vuln.json
        retention-days: 14

